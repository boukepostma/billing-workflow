[project]
name = "billing-workflow"
version = "0.1.0"
description = "End-to-end sprint billing workflow on Mistral AI Workflows (e-Boekhouden + Proton Mail SMTP)"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
